<meta property="og:title" content="Marnies Glaze Garden"><meta property="og:image" content="https://kevinkaslana093.github.io/marnies-glaze-garden-193/v9/share-preview.png"><link rel="icon" href="share-preview.png" type="image/png"></head>
<body>
  <div id="GameDiv" cc_exact_fit_screen="true">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
      </div>
    </div>
  

<style>
#official-loading{position:fixed;inset:0;z-index:99999;background:#171717;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:42px}#official-loading[hidden]{display:none}#official-loading-logo{width:100px;height:auto;max-height:143px;object-fit:contain}.official-track{height:4px;width:220px;background:#454545;overflow:hidden}.official-fill{height:100%;width:0;background:#428bca;transition:width .12s linear}.official-fill.indeterminate{width:30%;animation:official-progress 1.2s linear infinite}@keyframes official-progress{from{transform:translateX(-100%)}to{transform:translateX(340%)}}#official-loading-retry{border:0;padding:0;width:180px;height:64px;background:transparent;cursor:pointer}#official-loading-retry img{width:100%;height:100%;object-fit:contain}#official-loading-retry[hidden]{display:none}
</style>
<div id="official-loading" data-cocos-official-loading="true" role="status" aria-label="Loading">
 <img id="official-loading-logo" src="trial-loading/cocos-official.png" alt="Cocos Creator">
 <div class="official-track"><div class="official-fill indeterminate"></div></div>
 <button id="official-loading-retry" aria-label="Retry" hidden><img src="trial-loading/official-retry.png" alt=""></button>
</div>
<script>
(()=>{const root=document.getElementById('official-loading'),fill=root.querySelector('.official-fill'),retry=document.getElementById('official-loading-retry');let retryAction=()=>location.reload();window.__mggLoading={show(){root.hidden=false;retry.hidden=true;fill.style.width='';fill.classList.add('indeterminate');},progress(value){if(value>0){fill.classList.remove('indeterminate');fill.style.width=Math.max(0,Math.min(1,value))*100+'%';}},hide(){root.hidden=true;},fail(action){root.hidden=false;fill.classList.remove('indeterminate');retry.hidden=false;retryAction=action||(()=>location.reload());}};retry.addEventListener('click',()=>{retry.hidden=true;retryAction();});addEventListener('error',e=>{if(!root.hidden&&(e.target?.tagName==='SCRIPT'||e.message))window.__mggLoading.fail();},true);})();
</script>

<!-- Polyfills bundle. -->

<script src="src/polyfills.bundle.js" charset="utf-8"> </script>


<!-- SystemJS support. -->
<script src="src/system.bundle.js" charset="utf-8"> </script>

<!-- Import map -->
<script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>

<script>
    System.import('./index.js').catch(function(err) { console.error(err); window.__mggLoading.fail(); })
</script>

</body>
</html>
